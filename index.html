<!DOCTYPE html>
<html>

<head>
  <title>HomeworkHelper</title>

<link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <h1>Homework Helper</h1>

    <button onclick="toggleMode()">
        Toggle Dark/Light 
    </button>
  </header>
  <div class="container">
    
    <h2>Add Homework</h2>
    <input
      type="text"
      id="homeworkInput"
      placeholder="Enter homework assignment"
      >
    <input
      type="date"
      id="dateInput"
      >
    <button onclick="addHomework()">
      Add Homework
    </button>
    <h2>Homework List</h2>
    <ul id="homeworkList"></ul>

<script src="script.js"></script>
</body>
</html>
