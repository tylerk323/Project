<!DOCTYPE html>
<html>

<head>
  <title>HomeworkHelper</title>

<link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <h1>Homework Helper</h1>

    <button onclick="toggleMode()">
        Toggle Dark/Light 
    </button>
  </header>
  <div class="container">
    
    <h2>Add Homework</h2>
    <input
      type="text"
      id="homeworkInput"
      placeholder="Enter homework assignment"
      >
    <input
      type="date"
      id="dateInput"
      >
    <select id="classInput">
      <option value="english">English</option>
      <option value="math">Math</option>
      <option value="philosophy">Philosophy</option>
      <option value="computerscience">Computer Science</option>
    </select>
    <button onclick="addHomework()">
      Add Homework
    </button>
    
    <h2>Homework List</h2>
    <ul id="homeworkList"></ul>

    <p>
      Enter your homework assignment, choose a due date, select the class it is for, and click Add Homework, after your have completed the assignment click it to mark it complete. If you prefer dark mode click the button to switch it!

    </p>

<script src="script.js"></script>
</body>
</html>
